services:
  app:
    build:
      context: .
    image: app
    container_name: app
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: ["uv", "run", "main.py"]

  postgres:
    image: postgres:17
    container_name: db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data 

  redis:
    image: redis:7
    container_name: redis1
    env_file:
      - .env
    volumes:
      - redis_volume:/data

volumes:
  postgres_data:
  redis_volume: